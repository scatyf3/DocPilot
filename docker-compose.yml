# Local stack: Postgres+pgvector, Redis, the FastAPI backend, its ingest worker and the Next.js frontend.
#   cp .env.example .env   # add keys, or set LLM_PROVIDER=fake EMBEDDING_PROVIDER=fake
#   docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot
      POSTGRES_DB: docpilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpilot"]
      interval: 2s
      retries: 30

  # Shared rate limits, retrieval caches and the ingest queue. Losing its data is harmless:
  # limits restart, caches refill, and the worker's sweeper re-enqueues jobs from Postgres.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment: &api-env
      DATABASE_URL: postgresql://docpilot:docpilot@db:5432/docpilot
      REDIS_URL: redis://redis:6379/0
      INGEST_MODE: queue
      CORS_ORIGINS: http://localhost:3000
    command: sh -c "docpilot db init && uvicorn docpilot.app:app --host 0.0.0.0 --port 8000 --workers 2"
    ports: ["8000:8000"]
    volumes: ["./evals/corpus:/corpus:ro"]   # sample docs: docker compose exec api docpilot ingest /corpus
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Parses, chunks and embeds uploads in the background. Scale with: --scale worker=3
  worker:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment: *api-env
    # db init is idempotent and takes a lock, so api and worker can both run it at start.
    command: sh -c "docpilot db init && docpilot worker"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
