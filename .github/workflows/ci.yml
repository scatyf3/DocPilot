name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot
          POSTGRES_DB: docpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docpilot" --health-interval 2s --health-retries 30
    env:
      # Set so the DB-backed integration tests run too (fake LLM + embedder, no keys).
      DATABASE_URL: postgresql://docpilot:docpilot@localhost:5432/docpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e "api[dev]"
      - run: ruff check api/src api/tests evals
      - run: python -m evals.dataset
      - run: pytest api -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
