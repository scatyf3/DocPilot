[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docpilot"
version = "0.1.0"
description = "Upload docs, chat with an agent that cites its sources."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "anthropic>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "ruff>=0.6",
]
benchmarks = [
    "huggingface_hub>=0.23",
    "pyarrow>=16",
]

[project.scripts]
docpilot = "docpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: needs a Postgres+pgvector DATABASE_URL"]
